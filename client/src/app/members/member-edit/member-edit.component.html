<div class="row member-edit" *ngIf="member">


<div class="col-12 col-md-4 mb-4">
<h1 class="profile-title">Your Profile</h1>
</div>


<div class="col-12 col-md-8 mb-3">
<div class="alert alert-warning save-warning" *ngIf="editForm.dirty">
<strong>Heads up!</strong> You have unsaved changes.
</div>
</div>


<div class="col-12 col-md-4">
<div class="card profile-card">
<img
src="{{ member.photoUrl || './assets/user.png' }}"
alt="{{ member.knownAs }}"
class="profile-img">


<div class="card-body profile-info">
<div class="info-row">
<span>📍 Location</span>
<p>{{ member.city }}, {{ member.country }}</p>
</div>
<div class="info-row">
<span>🎂 Age</span>
<p>{{ member.age }}</p>
</div>
<div class="info-row">
<span>⏱ Last Active</span>
<p>{{ member.lastActive | timeago }}</p>
</div>
<div class="info-row">
<span>🗓 Member Since</span>
<p>{{ member.created | date: 'dd MMM yyyy' }}</p>
</div>
</div>


<div class="card-footer profile-footer">
<button
[disabled]="!editForm.dirty"
form="editForm"
type="submit"
class="btn btn-success w-100">
Save Changes
</button>
</div>
</div>
</div>


<div class="col-12 col-md-8">
<tabset class="member-tabset">


<tab heading="About {{ member.knownAs }}">
<form #editForm="ngForm" (ngSubmit)="updateMember()" id="editForm">


<h4 class="section-title">About Me</h4>
<textarea
[(ngModel)]="member.about"
class="form-control about-textarea"
name="about"
rows="6"></textarea>


<h4 class="section-title mt-3">Location Details</h4>
<div class="row">
<div class="col-md-6 mb-2">
<label>City</label>
<input
[(ngModel)]="member.city"
type="text"
name="city"
class="form-control">
</div>
<div class="col-md-6 mb-2">
<label>Country</label>
<input
[(ngModel)]="member.country"
type="text"
name="country"
class="form-control">
</div>
</div>


</form>
</tab>


<tab heading="Edit Photos">
<app-photo-editor [member]="member"></app-photo-editor>
</tab>


</tabset>
</div>
</div>
