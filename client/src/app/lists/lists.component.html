<div class="likes-page">
  <div class="text-center mt-4 mb-3">
    <h2 class="page-title">
      {{ predicate === 'liked' ? 'Members I Like' : 'Members Who Like Me' }}
    </h2>
    <p class="page-subtitle">
      Manage your connections and see who’s interested 💖
    </p>
  </div>

  <div class="container">
    <div class="row justify-content-center mb-4">
      <div class="btn-group likes-toggle" name="predicate">
        <button
          class="btn btn-primary"
          btnRadio="liked"
          [(ngModel)]="predicate"
          (click)="loadLikes()"
        >
          Members I like
        </button>

        <button
          class="btn btn-primary"
          btnRadio="likedBy"
          [(ngModel)]="predicate"
          (click)="loadLikes()"
        >
          Members who like me
        </button>
      </div>
    </div>

    <div class="row mt-3 g-4">
      <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let member of members">
        <app-member-card [member]="member"></app-member-card>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-center mt-4" *ngIf="pagination">
    <pagination
      [boundaryLinks]="true"
      [totalItems]="pagination.totalItems"
      [itemsPerPage]="pagination.itemsPerPage"
      [(ngModel)]="pagination.currentPage"
      (pageChanged)="pageChanged($event)"
      previousText="&lsaquo;"
      nextText="&rsaquo;"
      firstText="&laquo;"
      lastText="&raquo;"
    >
    </pagination>
  </div>
</div>
