<div class="row mb-4">
<div class="btn-group message-filters" name="container" data-bs-toggle="buttons">
<button class="btn btn-outline-primary btn-sm" btnRadio="Unread" [(ngModel)]="container" (click)="loadMessages()">
<i class="fa fa-envelope"></i> Unread
</button>
<button class="btn btn-outline-primary btn-sm" btnRadio="Inbox" [(ngModel)]="container" (click)="loadMessages()">
<i class="fa fa-envelope-open"></i> Inbox
</button>
<button class="btn btn-outline-primary btn-sm" btnRadio="Outbox" [(ngModel)]="container" (click)="loadMessages()">
<i class="fa fa-paper-plane"></i> Outbox
</button>
</div>
</div>


<div class="row empty-state" *ngIf="messages?.length === 0">
<div class="col text-center">
<h3>No messages yet 💬</h3>
<p class="text-muted">When someone writes to you, conversations will appear here.</p>
</div>
</div>


<div class="row" *ngIf="messages?.length > 0">
<div class="table-responsive">
<table class="table messages-table align-middle">
<thead>
<tr>
<th>Message</th>
<th>From / To</th>
<th>Sent</th>
<th></th>
</tr>
</thead>
<tbody>
<tr
[hidden]="loading"
*ngFor="let message of messages"
routerLink="{{ container === 'Outbox'
? '/members/' + message.recipientUsername
: '/members/' + message.senderUsername }}"
[queryParams]="{ tab: 2 }"
class="message-row">


<td class="message-content">{{ message.content }}</td>


<td>
<div class="d-flex align-items-center" *ngIf="container === 'Outbox'">
<img
class="avatar me-2"
src="{{ message.recipientPhotoUrl || './assets/user.png' }}"
alt="{{ message.recipientUsername }}">
<strong>{{ message.recipientUsername | titlecase }}</strong>
</div>


<div class="d-flex align-items-center" *ngIf="container !== 'Outbox'">
<img
class="avatar me-2"
src="{{ message.senderPhotoUrl || './assets/user.png' }}"
alt="{{ message.senderUsername }}">
<strong>{{ message.senderUsername | titlecase }}</strong>
</div>
</td>


<td class="text-muted">{{ message.messageSent | timeago }}</td>


<td class="text-end">
<button
(click)="$event.stopPropagation()"
(click)="deleteMessage(message.id)"
class="btn btn-outline-danger btn-sm">
Delete
</button>
</td>
</tr>
</tbody>
</table>
</div>
</div>


<div class="d-flex justify-content-center mt-4" *ngIf="pagination && !loading">
<pagination
[boundaryLinks]="true"
[totalItems]="pagination.totalItems"
[itemsPerPage]="pagination.itemsPerPage"
[(ngModel)]="pagination.currentPage"
(pageChanged)="pageChanged($event)"
previousText="&lsaquo;"
nextText="&rsaquo;"
firstText="&laquo;"
lastText="&raquo;">
</pagination>
</div>
